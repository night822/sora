- id: 空间控制-01
  type: 空间型
  trigger: 航线下方人口密度超标，或存在高大障碍物导致地形撞击风险。
  parameter_change: 地面风险 (GE) 绝对值下降 1.2。
  cost: 强制改航绕飞，单次飞行距离增加 5-10 公里，航空器能耗与运行时间上升。
  evidence: 代理数据 (PROXY-C) —— 依据历史通航障碍物相撞报告推演。

- id: 时间控制-01
  type: 时间型
  trigger: 目标空域交通密度超过 20 架次/小时，空中相撞风险极高。
  parameter_change: 空中相撞概率显著下降，综合空中冲突风险 (AC) 降低 1.4。
  cost: 实施高峰期错峰运行，打乱既有排班计划，导致 15% 的日均训练航班延误。
  evidence: 一手真实数据 (REAL-A) —— 提取自某飞行学院真实运行排班记录。

- id: 数字控制-01
  type: 数字型
  trigger: 在非管制空域运行，且现有设备缺乏足够的态势感知能力。
  parameter_change: 探测能力大幅提升，残余碰撞风险下降 1.2。
  cost: 强制加装机载防撞系统及冗余通信链路，直接推高单机硬件采购与维护成本。
  evidence: 官方公开数据 (OFFICIAL-B) —— 参考民航局强制加装监视设备的政策文件。

- id: 组织控制-01
  type: 组织型
  trigger: 高频次起落导致机组人员达到疲劳临界点，人为失误概率飙升。
  parameter_change: 抵消人为失误带来的不确定性，放宽系统整体风险容差。
  cost: 严格执行机组强制休息标准，通航企业需额外雇佣 20% 的飞行教员作为轮换梯队。
  evidence: 代理数据 (PROXY-C) —— 结合航空人为因素疲劳模型测算。